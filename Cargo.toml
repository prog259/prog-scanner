[package]
name = "prog-scanner"
version = "1.1.0"
edition = "2021"
description = "Read-only scanner that lists installed programs on Windows. Changes nothing."
license = "MIT"

[dependencies]

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = 2
lto = true
strip = true
